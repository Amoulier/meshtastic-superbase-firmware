name: Internal Superbase develop integration

on:
  push:
    branches:
      - integration/muzi-base-superbase5-merge-20260829
    paths:
      - .github/workflows/internal_superbase5_merge.yml

permissions:
  contents: write

jobs:
  merge-develop:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge reviewed develop baseline
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Amoulier"
          git config user.email "Amoulier@gmail.com"
          git fetch origin develop
          git merge --no-ff --no-commit -X ours origin/develop
          rm .github/workflows/internal_superbase5_merge.yml
          git add -A
          git commit -m "merge(superbase): integrate current develop baseline"
          git push origin HEAD:integration/muzi-base-superbase5-merge-20260829
