name: Release MuziWorks Superbase v2.8.0-superbase.5

on:
  push:
    branches:
      - "release/muzi-base-2.8.0-superbase.5"
    paths:
      - .github/workflows/release_muzi_superbase_2_8_0_5.yml

permissions: read-all

jobs:
  integration-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Audit custom Superbase invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^
          if git grep -n -E '^(<<<<<<<|>>>>>>>)' -- ':!*.md'; then
            echo "Merge conflict marker found" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          required = {
              "src/AudioThread.h": ["SPILock.h", "RtttlOwner", "rtttlLock"],
              "src/modules/ExternalNotificationModule.cpp": ["buzzerModeAllowsNotification", "stopBuzzerNow", "Time::getMillis"],
              "src/modules/ExternalNotificationModule.h": ["BuzzerPlaybackBackend", "buzzerAlertIsDirectMessage"],
              "src/motion/ICM20948Sensor.cpp": ["MUZI_BASE", "AK09916_mode_power_down", "AK09916_mode_cont_100hz"],
              "test/test_packet_signing/test_main.cpp": ["sendAckNak", "meshtastic_MeshPacket"],
          }
          for name, markers in required.items():
              data = Path(name).read_text(encoding="utf-8")
              if name.endswith("test_main.cpp") and len(data) < 20000:
                  raise SystemExit(f"{name} unexpectedly small: {len(data)} bytes")
              missing = [m for m in markers if m not in data]
              if missing:
                  raise SystemExit(f"{name} missing required markers: {missing}")
              print(f"OK {name}: {len(data)} bytes")
          PY

  native-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup native build
        uses: ./.github/actions/setup-native
      - name: Disable BUILD_EPOCH
        run: sed -i 's/-DBUILD_EPOCH=$UNIX_TIME/#-DBUILD_EPOCH=$UNIX_TIME/' platformio.ini
      - name: Run Superbase-relevant native suites
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 35m platformio test -e coverage \
            --filter test_buzzer_mode \
            --filter test_mqtt \
            --filter test_reliable_ack_matrix \
            --filter test_mesh_module \
            --filter test_packet_signing \
            --filter test_nexthop_routing \
            --filter test_radio \
            --filter test_position_module \
            --filter test_uptime_clock

  build-muzi-base:
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: 2.8.0-superbase.5
      platform: nrf52840
      pio_env: muzi-base

  release:
    needs:
      - integration-audit
      - native-critical
      - build-muzi-base
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Muzi Base firmware
        uses: actions/download-artifact@v8
        with:
          name: firmware-nrf52840-muzi-base-2.8.0-superbase.5
          path: release-assets

      - name: Select Muzi Base release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          uf2_files=(release-assets/firmware-muzi-base-*.uf2)
          manifest_files=(release-assets/firmware-muzi-base-*.mt.json)
          ota_files=(release-assets/firmware-muzi-base-*-ota.zip)
          if [[ ${#uf2_files[@]} -ne 1 || ${#manifest_files[@]} -ne 1 || ${#ota_files[@]} -ne 1 ]]; then
            echo "Expected exactly one Muzi Base UF2, manifest, and OTA DFU package" >&2
            find release-assets -maxdepth 1 -type f -print | sort >&2
            exit 1
          fi
          mkdir curated-release-assets
          cp "${uf2_files[0]}" "${manifest_files[0]}" "${ota_files[0]}" curated-release-assets/

      - name: Validate Nordic OTA DFU package
        shell: bash
        run: |
          ota_file=(curated-release-assets/firmware-muzi-base-*-ota.zip)
          python - "${ota_file[0]}" <<'PY'
          import json
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as package:
              entries = sorted(package.namelist())
              manifest = json.loads(package.read("manifest.json"))
          application = manifest["manifest"]["application"]
          expected = sorted(["manifest.json", application["bin_file"], application["dat_file"]])
          if entries != expected:
              raise SystemExit(f"Unexpected Nordic DFU package contents: {entries}")
          if not application["bin_file"].endswith(".bin") or not application["dat_file"].endswith(".dat"):
              raise SystemExit("Nordic DFU manifest has invalid application filenames")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Create Muzi Base firmware bundle
        run: zip -j -9 firmware-muzi-base-v2.8.0-superbase.5-bundle.zip curated-release-assets/*.uf2 curated-release-assets/*.mt.json curated-release-assets/*-ota.zip

      - name: Publish Superbase prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.8.0-superbase.5
          target_commitish: ${{ github.sha }}
          name: Meshtastic 2.8.0 for MuziWorks Superbase — Upstream Sync and Reliability Update
          prerelease: true
          generate_release_notes: false
          body: |
            Custom Meshtastic 2.8.0 firmware exclusively for the MuziWorks Superbase (`muzi-base`).

            ## Included improvements
            - Integrates the reviewed current `develop` baseline while preserving the Superbase-specific behavior validated in v2.8.0-superbase.4.
            - Preserves MQTT implicit ACK behavior so a relayed channel broadcast does not later regress to **Failed to deliver to mesh** because of timeout/retransmit handling.
            - Preserves the corrected **DMs Only** buzzer behavior and RTTTL ownership/locking fixes.
            - Preserves the Muzi Base 12-hour stationary position interval rather than the upstream 6-hour interval, reducing unnecessary stationary transmissions.
            - Preserves the Superbase-only ICM20948/AK09916 optimization: the magnetometer enters power-down with the sleeping IMU and returns to continuous 100 Hz operation on wake.
            - Carries forward reviewed upstream routing/relay metadata and common reliability/configuration fixes.
            - Preserves the upstream `SPILock` integration alongside the custom Superbase audio protections.
            - RX Boosted Gain and LoRa TX power are unchanged.

            ## Validation gates
            - Superbase custom invariants and source integrity are checked before publication.
            - Buzzer, MQTT, reliable-ACK, mesh module, packet-signing, next-hop routing, radio, position and uptime native suites must pass.
            - A fresh `nrf52840 / muzi-base` firmware build must pass.
            - The Nordic OTA DFU ZIP is structurally validated before upload.

            ## Installation
            - OTA: select `firmware-muzi-base-*-ota.zip` without extracting it. This requires the MuziWorks OTAFIX bootloader.
            - USB/UF2: enter the UF2 bootloader and copy `firmware-muzi-base-*.uf2` to the mounted `muzi-Base` drive.
            - The bundle ZIP contains the OTA package, UF2 firmware and Meshtastic manifest.

            Back up the node configuration before flashing. This is an unofficial prerelease from this fork for physical validation.
          files: |
            firmware-muzi-base-v2.8.0-superbase.5-bundle.zip
            curated-release-assets/firmware-muzi-base-*.uf2
            curated-release-assets/firmware-muzi-base-*.mt.json
            curated-release-assets/firmware-muzi-base-*-ota.zip
          fail_on_unmatched_files: true
