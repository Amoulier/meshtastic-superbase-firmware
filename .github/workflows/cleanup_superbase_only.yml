name: Cleanup repository for MuziWorks Superbase only

on:
  push:
    branches:
      - "cleanup/superbase-only-20260830"
    paths:
      - .github/workflows/cleanup_superbase_only.yml

permissions:
  contents: write

jobs:
  prune-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prune board catalog to MuziWorks Superbase
        shell: bash
        run: |
          set -euo pipefail

          find boards -maxdepth 1 -type f ! -name 'muzi-base.json' -delete

          test -f boards/muzi-base.json
          test "$(find boards -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find variants -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tr '\n' ' ')" = "native nrf52840 "

          echo "Remaining board catalog:"
          find boards -maxdepth 1 -type f -print | sort
          echo "Remaining variant tree:"
          find variants -maxdepth 3 \( -type f -o -type d \) -print | sort
          git diff --check

      - name: Install PlatformIO build tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<72" platformio adafruit-nrfutil

      - name: Build MuziWorks Superbase after board pruning
        shell: bash
        run: |
          set -euo pipefail
          pio run -e muzi-base

      - name: Commit validated Superbase-only board catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Amoulier"
          git config user.email "Amoulier@gmail.com"
          git add boards
          git diff --cached --check
          git commit -m "chore: keep only MuziWorks Superbase board definition"
          git push origin HEAD:cleanup/superbase-only-20260830
