name: Cleanup repository for MuziWorks Superbase only

on:
  push:
    branches:
      - "cleanup/superbase-only-20260830"
    paths:
      - .github/workflows/cleanup_superbase_only.yml

permissions:
  contents: write

jobs:
  prune-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prune hardware variants to Superbase plus native test support
        shell: bash
        run: |
          set -euo pipefail

          for path in variants/*; do
            [[ -d "$path" ]] || continue
            name="$(basename "$path")"
            case "$name" in
              nrf52840|native) ;;
              *) rm -rf "$path" ;;
            esac
          done

          for path in variants/nrf52840/*; do
            name="$(basename "$path")"
            case "$name" in
              muzi_base|cpp_overrides|nrf52.ini|nrf52840.ini) ;;
              *) rm -rf "$path" ;;
            esac
          done

          python - <<'PY'
          from pathlib import Path
          p = Path("platformio.ini")
          text = p.read_text(encoding="utf-8")
          text = text.replace("default_envs = heltec-v3", "default_envs = muzi-base", 1)
          start = text.index("extra_configs =\n")
          marker = "\ndescription = Meshtastic"
          end = text.index(marker, start)
          replacement = (
              "extra_configs =\n"
              "\tvariants/native/portduino.ini\n"
              "\tvariants/nrf52840/nrf52.ini\n"
              "\tvariants/nrf52840/nrf52840.ini\n"
              "\tvariants/nrf52840/muzi_base/platformio.ini\n"
          )
          text = text[:start] + replacement + text[end:]
          text = text.replace("description = Meshtastic", "description = MuziWorks Superbase Meshtastic firmware", 1)
          p.write_text(text, encoding="utf-8")
          PY

          echo "Remaining variant tree:"
          find variants -maxdepth 3 -type f -o -type d | sort
          git diff --check

      - name: Install PlatformIO build tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<72" platformio adafruit-nrfutil

      - name: Build MuziWorks Superbase after pruning
        shell: bash
        run: |
          set -euo pipefail
          pio run -e muzi-base

      - name: Commit validated Superbase-only hardware tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Amoulier"
          git config user.email "Amoulier@gmail.com"
          git add platformio.ini variants
          git diff --cached --check
          git commit -m "chore: make hardware tree MuziWorks Superbase only"
          git push origin HEAD:cleanup/superbase-only-20260830
