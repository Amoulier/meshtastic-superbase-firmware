name: Build MuziWorks Superbase

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions: read-all

jobs:
  pio-build:
    name: build-nrf52840-muzi-base
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-firmware.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build MuziWorks Superbase
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: nrf52840
          pio_env: muzi-base
          pio_target: build

      - name: Audit exact source and install packages
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          python3 bin/audit-superbase-release.py --packages release --sha "$EXPECTED_SHA" --output audit-evidence/package-audit.json

      - uses: actions/upload-artifact@v7
        with:
          name: superbase-package-audit-${{ inputs.version }}
          path: audit-evidence/
          if-no-files-found: error

      - name: Job summary
        run: |
          echo "## muzi-base" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat release/firmware-muzi-base-*.mt.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Store Superbase firmware artifact
        uses: actions/upload-artifact@v7
        id: upload-firmware
        with:
          name: firmware-nrf52840-muzi-base-${{ inputs.version }}
          overwrite: true
          path: |
            release/firmware-muzi-base-*.mt.json
            release/firmware-muzi-base-*.uf2
            release/firmware-muzi-base-*-ota.zip

      - name: Store Superbase manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: manifest-nrf52840-muzi-base-${{ inputs.version }}
          overwrite: true
          path: release/firmware-muzi-base-*.mt.json
