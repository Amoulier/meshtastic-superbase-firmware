name: Validate Superbase integration

on:
  push:
    branches:
      - "integration/muzi-base-superbase5-20260829"

permissions: read-all

jobs:
  native-critical:
    if: startsWith(github.event.head_commit.message, 'merge(superbase):')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup native build
        uses: ./.github/actions/setup-native
      - name: Disable BUILD_EPOCH
        run: sed -i 's/-DBUILD_EPOCH=$UNIX_TIME/#-DBUILD_EPOCH=$UNIX_TIME/' platformio.ini
      - name: Validate packet-signing source integrity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/test_packet_signing/test_main.cpp')
          raw = p.read_bytes()
          text = raw.decode('utf-8')
          required = (
              'UNITY_BEGIN()', 'UNITY_END()', 'class AuthPipelineRoutingModule',
              'const meshtastic_MeshPacket * = nullptr',
              'test_A1_valid_signature_accepted_and_learns_signer',
              'test_E13_decoded_unsigned_nodeinfo_padded_inside_payload_dropped',
          )
          missing = [token for token in required if token not in text]
          if missing or len(raw) < 70000:
              raise SystemExit(f'invalid packet-signing source: size={len(raw)}, missing={missing}')
          print(f'packet-signing source OK: {len(raw)} bytes')
          PY
      - name: Run Superbase-relevant native suites
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 30m platformio test -e coverage \
            --filter test_packet_signing \
            --filter test_mqtt \
            --filter test_reliable_ack_matrix \
            --filter test_nexthop_routing \
            --filter test_nodedb_boot_recovery \
            --filter test_radio \
            --filter test_buzzer_mode

  build-muzi-base:
    if: startsWith(github.event.head_commit.message, 'merge(superbase):')
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: 2.8.0-superbase5-integration-audit
      platform: nrf52840
      pio_env: muzi-base
