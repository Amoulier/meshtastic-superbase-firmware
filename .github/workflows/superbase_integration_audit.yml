name: Superbase navigation correction audit
on:
  push:
    branches: [audit/superbase-selective-20260905]
permissions: read-all
concurrency:
  group: superbase-navigation-audit-v2
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.fix.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ca17256b820d51eb72bec3c7911ff75f25940eaa
          fetch-depth: 0
      - name: Correct fixture against the pinned protobuf enum
        id: fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/test_superbase_navigation/test_main.cpp')
          s=p.read_text(); old='meshtastic_Config_DisplayConfig_OledType_AUTO'
          assert s.count(old)==1
          p.write_text(s.replace(old,'meshtastic_Config_DisplayConfig_OledType_OLED_AUTO'))
          PY
          git config user.name Amoulier
          git config user.email 19624653+Amoulier@users.noreply.github.com
          git add test/test_superbase_navigation/test_main.cpp
          git diff --cached --check
          git commit -m 'test(superbase): use correct OLED enum in navigation fixture'
          python3 bin/audit-superbase-release.py --source --output audit-evidence/source-audit.json
          git push origin HEAD:refs/heads/fix/superbase-navigation-20260905
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff 7c39922e028a68dbe3af7470aea8eb8d849fc569 HEAD > audit-evidence/navigation.diff
          git archive HEAD | gzip > audit-evidence/source.tar.gz
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: navigation-source
          path: audit-evidence/
          if-no-files-found: error
  native-after:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
      - uses: ./.github/actions/setup-native
      - name: Full corrected-source native regression tests
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          sed -i 's/-DBUILD_EPOCH=$UNIX_TIME/#-DBUILD_EPOCH=$UNIX_TIME/' platformio.ini
          python3 bin/test-superbase.py --shard "$SHARD" --shards 3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: navigation-native-${{ matrix.shard }}
          path: |
            audit-evidence/
            .pio/test-state/
          include-hidden-files: true
          if-no-files-found: error
  regression-before:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7c39922e028a68dbe3af7470aea8eb8d849fc569
          submodules: recursive
      - uses: ./.github/actions/setup-native
      - name: Reproduce failures in withdrawn driver with new test fixture only
        env:
          FIXED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$FIXED_SHA"
          mkdir -p test/test_superbase_navigation audit-evidence
          for path in test/test_superbase_navigation/test_main.cpp src/graphics/Screen.h test/state-manifest.tsv; do
            git show "$FIXED_SHA:$path" > "$path"
          done
          git diff --exit-code -- src/input/
          sed -i 's/-DBUILD_EPOCH=$UNIX_TIME/#-DBUILD_EPOCH=$UNIX_TIME/' platformio.ini
          set +e
          platformio test -e superbase-native-tests --filter test_superbase_navigation --junit-output-path audit-evidence/baseline-junit.xml > audit-evidence/baseline.log 2>&1
          result=$?
          set -e
          cat audit-evidence/baseline.log
          test "$result" != 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, json
          from pathlib import Path
          cases=list(ET.parse('audit-evidence/baseline-junit.xml').getroot().iter('testcase'))
          assert len(cases)==21, [(c.attrib,c.find('error') is not None) for c in cases]
          assert not any(c.find('error') is not None or c.find('skipped') is not None for c in cases)
          failed={c.attrib['name'] for c in cases if c.find('failure') is not None}
          required={'test_released_left_tap','test_released_right_tap','test_right_without_interrupt','test_select_without_interrupt','test_ui_right_without_irq_changes_frame'}
          assert required <= failed, failed
          report={'withdrawn_source':'7c39922e028a68dbe3af7470aea8eb8d849fc569','status':'REGRESSION_REPRODUCED','cases':len(cases),'failed':sorted(failed),'hardware_tested':False}
          Path('audit-evidence/regression-before.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: navigation-regression-before
          path: |
            audit-evidence/
            .pio/test-state/
          include-hidden-files: true
          if-no-files-found: error
  firmware:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
      - uses: meshtastic/gh-action-firmware@218dd4b473a37d7925d7cb2867ccddfba3ec2cff
        with:
          pio_platform: nrf52840
          pio_env: muzi-base
          pio_target: build
      - name: Validate candidate packages and hardware handlers
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          python3 bin/audit-superbase-release.py --packages release --sha "$EXPECTED_SHA" --output release/package-audit.json
          mkdir -p navigation-elf
          cp .pio/build/muzi-base/firmware-muzi-base-*.elf navigation-elf/
          readelf -sW .pio/build/muzi-base/firmware-muzi-base-*.elf > navigation-elf/symbols.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: navigation-candidate-firmware
          path: |
            release/firmware-muzi-base-*.mt.json
            release/firmware-muzi-base-*.uf2
            release/firmware-muzi-base-*-ota.zip
            release/package-audit.json
            navigation-elf/
          if-no-files-found: error
  verification:
    needs: [prepare, native-after, regression-before, firmware]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require reproduced fault and passing corrected source
        env:
          PREPARE: ${{ needs.prepare.result }}
          NATIVE: ${{ needs.native-after.result }}
          BASELINE: ${{ needs.regression-before.result }}
          FIRMWARE: ${{ needs.firmware.result }}
        run: |
          test "$PREPARE" = success
          test "$NATIVE" = success
          test "$BASELINE" = success
          test "$FIRMWARE" = success
          echo 'No release publication. Physical-device confirmation remains pending.' >> "$GITHUB_STEP_SUMMARY"
