name: Withdraw defective Superbase 7 release

on:
  push:
    branches: [audit/superbase-selective-20260905]

permissions:
  contents: write

concurrency:
  group: superbase-final-release-publication
  cancel-in-progress: false

jobs:
  withdraw:
    if: github.repository == 'Amoulier/meshtastic-superbase-firmware'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete only the user-reported defective release and its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = 'https://api.github.com/repos/Amoulier/meshtastic-superbase-firmware'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET'):
              with urllib.request.urlopen(urllib.request.Request(base+path, method=method, headers=headers), timeout=30) as r:
                  body = r.read()
                  return json.loads(body) if body else None
          try:
              release = api('/releases/383302135')
          except urllib.error.HTTPError as exc:
              if exc.code != 404: raise
              release = None
          if release is not None:
              assert release['tag_name'] == 'v2.8.0-superbase.7'
              assert release['target_commitish'] == '7c39922e028a68dbe3af7470aea8eb8d849fc569'
              api('/releases/383302135', 'DELETE')
          for path in ['/releases/383302135', '/releases/tags/v2.8.0-superbase.7']:
              try:
                  api(path)
              except urllib.error.HTTPError as exc:
                  if exc.code != 404: raise
              else:
                  raise RuntimeError('Defective release is still available: '+path)
          result = {'withdrawn_release':'v2.8.0-superbase.7','release_id':383302135,
                    'status':'REMOVED','reason':'User reports built-in navigation buttons do not change BaseUI',
                    'tag_retained_for_audit':True,'no_replacement_release_published':True}
          with open('withdrawal.json','w') as f: json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: superbase-7-withdrawal
          path: withdrawal.json
          if-no-files-found: error
