name: Superbase navigation baseline diagnostics

on:
  push:
    branches: [audit/superbase-selective-20260905]

permissions: read-all

jobs:
  baseline-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7c39922e028a68dbe3af7470aea8eb8d849fc569
          submodules: recursive
      - uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: nrf52840
          pio_env: muzi-base
          pio_target: build
      - name: Collect actual linked handlers and navigation libraries
        run: |
          set -euo pipefail
          mkdir -p navigation-baseline
          test "$(git rev-parse HEAD)" = 7c39922e028a68dbe3af7470aea8eb8d849fc569
          cp .pio/build/muzi-base/firmware.elf navigation-baseline/
          readelf -sW .pio/build/muzi-base/firmware.elf > navigation-baseline/symbols.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          targets = {'OLEDDisplayUi.cpp','OLEDDisplayUi.h','OLEDDisplay.cpp','OLEDDisplay.h','Thread.cpp','Thread.h','ThreadController.cpp','ThreadController.h'}
          with zipfile.ZipFile('navigation-baseline/dependencies.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('.pio/libdeps/muzi-base').rglob('*'):
                  if p.name in targets and p.is_file():
                      z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: superbase-navigation-baseline
          path: navigation-baseline/
          if-no-files-found: error
