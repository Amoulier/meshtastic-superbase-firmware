name: Superbase final release publication

on:
  push:
    branches: [audit/superbase-selective-20260905]

permissions:
  contents: write
  actions: read

concurrency:
  group: superbase-final-release-publication
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 7c39922e028a68dbe3af7470aea8eb8d849fc569
  AUDIT_RUN: '33977313891'

jobs:
  publish:
    if: github.repository == 'Amoulier/meshtastic-superbase-firmware'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed publication scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: publication-tools
      - name: Stage publication scripts outside candidate source
        run: |
          cp publication-tools/.github/scripts/prepare-superbase-release.py "$RUNNER_TEMP/prepare-superbase-release.py"
          cp publication-tools/.github/scripts/publish-superbase-release.py "$RUNNER_TEMP/publish-superbase-release.py"
          python3 -m py_compile "$RUNNER_TEMP/prepare-superbase-release.py" "$RUNNER_TEMP/publish-superbase-release.py"
      - name: Checkout exact audited firmware source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          path: candidate
      - name: Reconcile all audit evidence and publish verified final assets
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_SCRIPT: ${{ runner.temp }}/prepare-superbase-release.py
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 "$RUNNER_TEMP/publish-superbase-release.py"
          echo 'Final release v2.8.0-superbase.7 published after exact-source audits and uploaded-asset SHA-256 checks.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain published files and publication confirmation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: superbase-published-release
          path: |
            candidate/release-assets/
            candidate/publication-result.json
            candidate/release-notes.md
          if-no-files-found: error
