name: Superbase selective integration audit

on:
  push:
    branches: [audit/superbase-selective-20260905]

permissions: read-all
concurrency:
  group: superbase-selective-integration
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/superbase-upstream-20260905
          fetch-depth: 0
      - name: Apply audited source corrections and regression tests
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 690aab29a1663c15f9741d13280874efdf8aaaa7
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          data = gzip.decompress(base64.b64decode(' '.replace('qpe a7','qPea7')))
          assert hashlib.sha256(data).hexdigest() == '0df0284dd6e9b9846c109dbe7d9cf289207ae512f378fbfbb60216fbd405515c'
          subprocess.run(['git','apply','--index'],input=data,check=True)
          PY
          git config user.name Amoulier
          git config user.email 19624653+Amoulier@users.noreply.github.com
          git diff --cached --check
          git commit -m 'fix(superbase): harden radio recovery and add strict release audits'
          python3 bin/audit-superbase-release.py --source --output audit-evidence/source-audit.json
          git push origin HEAD:refs/heads/integration/superbase-upstream-20260905
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive HEAD | gzip > audit-evidence/source.tar.gz
          git diff 4cbba7006a9fed23cb1a778b7e62422ba96ee8bc HEAD > audit-evidence/final-source.diff
          git log --format='%H %s' 4cbba7006a9fed23cb1a778b7e62422ba96ee8bc..HEAD > audit-evidence/commits.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: superbase-final-source
          path: audit-evidence/
          if-no-files-found: error

  native:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
      - uses: ./.github/actions/setup-native
      - name: Verify source identity and run attributed isolated tests
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          sed -i 's/-DBUILD_EPOCH=$UNIX_TIME/#-DBUILD_EPOCH=$UNIX_TIME/' platformio.ini
          python3 bin/test-superbase.py --shard "$SHARD" --shards 3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: superbase-final-native-${{ matrix.shard }}
          path: |
            audit-evidence/
            .pio/test-state/summary.tsv
          if-no-files-found: error
          include-hidden-files: true

  firmware:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
      - name: Fresh exact-source Superbase build
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: nrf52840
          pio_env: muzi-base
          pio_target: build
      - name: Audit matching OTA and UF2 images and memory boundaries
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          python3 bin/audit-superbase-release.py --packages release --sha "$EXPECTED_SHA" --output release/package-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: superbase-final-firmware
          path: |
            release/firmware-muzi-base-*.mt.json
            release/firmware-muzi-base-*.uf2
            release/firmware-muzi-base-*-ota.zip
            release/package-audit.json
          if-no-files-found: error

  verification:
    needs: [prepare, native, firmware]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful source, native and firmware audits
        env:
          PREPARE: ${{ needs.prepare.result }}
          NATIVE: ${{ needs.native.result }}
          FIRMWARE: ${{ needs.firmware.result }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          test "$PREPARE" = success
          test "$NATIVE" = success
          test "$FIRMWARE" = success
          echo "All automated candidate gates passed: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Publication requires final evidence review; this workflow does not publish.' >> "$GITHUB_STEP_SUMMARY"
